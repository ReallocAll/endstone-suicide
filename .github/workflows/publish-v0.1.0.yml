name: Publish v0.1.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v0.1.0.yml"

permissions:
  contents: write

jobs:
  publish:
    if: "github.repository == 'ReallocAll/endstone-suicide' && github.event.head_commit.message == 'release: publish v0.1.0'"
    runs-on: ubuntu-latest
    steps:
      - name: Check for existing tag or Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release v0.1.0 already exists"
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v0.1.0" >/dev/null 2>&1; then
            echo "::error::Tag v0.1.0 already exists"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 87435eba8093b9b430677b3659a711702005a89c
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv python install 3.15
      - name: Build source and wheel distributions
        run: uv build
      - name: Check distribution files
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          dist = Path("dist")
          wheels = list(dist.glob("endstone_suicide-0.1.0-*.whl"))
          source = list(dist.glob("endstone_suicide-0.1.0.tar.gz"))
          assert len(wheels) == 1 and len(source) == 1, (wheels, source)
          with ZipFile(wheels[0]) as z:
              files = z.namelist()
              assert "endstone_suicide/plugin.py" in files
              assert "endstone_suicide/__init__.py" in files
              entry = next(p for p in files if p.endswith(".dist-info/entry_points.txt"))
              assert "endstone_suicide:SuicidePlugin" in z.read(entry).decode()
          PY
      - name: Publish tagged GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.0 dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "87435eba8093b9b430677b3659a711702005a89c" \
            --title "v0.1.0" \
            --notes "Initial release of Endstone Suicide.

          - Adds the player-only /suicide command with no confirmation or cooldown.
          - Permission: suicide.command.suicide (available to all players by default).
          - No configuration, storage, event handlers, or background tasks.
          - Python 3.11–3.15; Endstone 0.11 API.
          - License: GPL-3.0-only.

          Install the .whl file in your Endstone server's plugins/ directory and restart the server." \
            --latest
