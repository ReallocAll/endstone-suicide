name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  checks:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-suffix: py${{ matrix.python-version }}
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --extra dev --python ${{ matrix.python-version }}
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync pytest -q

  build:
    name: Build and install wheel
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv python install 3.15
      - run: uv build
      - run: uv venv .venv-wheel --python 3.15
      - run: uv pip install --python .venv-wheel/bin/python --no-deps dist/*.whl
      - name: Validate wheel contents and installed entry point
        run: |
          .venv-wheel/bin/python - <<'PY'
          from importlib.metadata import distribution
          from pathlib import Path
          import sys
          import types
          from zipfile import ZipFile

          dist = distribution("endstone-suicide")
          assert dist.version == "0.1.0"
          entry = next(ep for ep in dist.entry_points if ep.group == "endstone" and ep.name == "suicide")
          assert entry.value == "endstone_suicide:SuicidePlugin"
          assert any(str(p).endswith("LICENSE") for p in dist.files)

          class Player:
              pass

          class CommandSender:
              pass

          class Command:
              pass

          class Plugin:
              pass

          endstone = types.ModuleType("endstone")
          endstone.Player = Player
          command = types.ModuleType("endstone.command")
          command.Command = Command
          command.CommandSender = CommandSender
          plugin = types.ModuleType("endstone.plugin")
          plugin.Plugin = Plugin
          sys.modules.update({"endstone": endstone, "endstone.command": command, "endstone.plugin": plugin})
          assert issubclass(entry.load(), Plugin)

          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1
          with ZipFile(wheels[0]) as archive:
              names = archive.namelist()
              assert "endstone_suicide/plugin.py" in names
              assert "endstone_suicide/__init__.py" in names
              assert not any(name.startswith(("tests/", ".github/")) for name in names)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: endstone-suicide-distributions
          path: dist/*
          if-no-files-found: error
